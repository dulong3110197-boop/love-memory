<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Love Memory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 min-h-screen flex items-center justify-center">

<div class="w-full max-w-2xl bg-white rounded-2xl shadow-lg p-6">
  <h1 class="text-2xl font-bold text-pink-500 mb-4">💗 Love Memory</h1>

  <!-- Form -->
  <div class="space-y-3 mb-6">
    <input id="title" class="w-full border rounded-xl p-2" placeholder="Hôm nay làm gì?">
    <input id="date" type="date" class="w-full border rounded-xl p-2">
    <textarea id="note" class="w-full border rounded-xl p-2" placeholder="Ghi chú nhẹ..."></textarea>
    <button onclick="addItem()" class="w-full bg-pink-500 text-white py-2 rounded-xl">Thêm kỷ niệm</button>
  </div>

  <!-- List -->
  <div id="list" class="space-y-3"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyC7SiVP_Fe8dFjldM8v6UgLjRD3ZSe1aDM",
    authDomain: "love-memory-34c26.firebaseapp.com",
    projectId: "love-memory-34c26",
    storageBucket: "love-memory-34c26.firebasestorage.app",
    messagingSenderId: "949896687757",
    appId: "1:949896687757:web:64a4aa7cd50d0a25db72c4",
    measurementId: "G-EQ14R38HPZ"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const list = document.getElementById('list');

  // 👉 LOAD REALTIME
  const q = query(collection(db, "memories"), orderBy("createdAt", "desc"));

  onSnapshot(q, (snapshot) => {
    list.innerHTML = "";
    snapshot.forEach(doc => {
      const item = doc.data();

      list.innerHTML += `
        <div class="border rounded-xl p-3 bg-pink-50">
          <h2>${item.title}</h2>
          <p class="text-sm text-gray-500">${item.date}</p>
          <p>${item.note}</p>
        </div>
      `;
    });
  });

  // 👉 THÊM KỶ NIỆM
  window.addItem = async function () {
    const title = document.getElementById('title').value;
    const date = document.getElementById('date').value;
    const note = document.getElementById('note').value;

    if (!title) {
      alert("Nhập gì đó đi");
      return;
    }

    await addDoc(collection(db, "memories"), {
      title,
      date,
      note,
      createdAt: new Date()
    });

    document.getElementById('title').value = "";
    document.getElementById('date').value = "";
    document.getElementById('note').value = "";
  };
</script>

</body>
</html>
