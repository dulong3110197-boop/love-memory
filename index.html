<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Love Memory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 min-h-screen flex items-center justify-center">

<div class="w-full max-w-2xl bg-white rounded-2xl shadow-lg p-6">
  <h1 class="text-2xl font-bold text-pink-500 mb-4">💗 Love Memory</h1>

  <!-- Form -->
  <div class="space-y-3 mb-6">
    <input id="title" class="w-full border rounded-xl p-2" placeholder="Hôm nay làm gì?">
    <input id="date" type="date" class="w-full border rounded-xl p-2">
    <textarea id="note" class="w-full border rounded-xl p-2" placeholder="Ghi chú nhẹ..."></textarea>
    <button onclick="addItem()" class="w-full bg-pink-500 text-white py-2 rounded-xl">Thêm kỷ niệm</button>
  </div>

  <!-- List -->
  <div id="list" class="space-y-3"></div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('love_memory') || '[]');

function save() {
  localStorage.setItem('love_memory', JSON.stringify(data));
}

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';

  data.slice().reverse().forEach((item, index) => {
    list.innerHTML += `
      <div class="border rounded-xl p-3 bg-pink-50">
        <div class="flex justify-between items-center">
          <h2 class="font-semibold">${item.title}</h2>
          <button onclick="removeItem(${index})" class="text-red-400">X</button>
        </div>
        <p class="text-sm text-gray-500">${item.date}</p>
        <p class="mt-1">${item.note}</p>
      </div>
    `;
  });
}

function addItem() {
  const title = document.getElementById('title').value;
  const date = document.getElementById('date').value;
  const note = document.getElementById('note').value;

  if (!title) return alert('Nhập gì đó đi');

  data.push({ title, date, note });
  save();
  render();

  document.getElementById('title').value = '';
  document.getElementById('date').value = '';
  document.getElementById('note').value = '';
}

function removeItem(index) {
  data.splice(data.length - 1 - index, 1);
  save();
  render();
}

render();
</script>

</body>
</html>
